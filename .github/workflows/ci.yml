name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) with rustfmt and clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Run the verification gate
        run: make ci
